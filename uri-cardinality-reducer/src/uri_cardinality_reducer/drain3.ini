[DRAIN]
sim_th = 0.4
depth = 5
max_children = 100
max_clusters = 10000
extra_delimiters = ["?", "&", "=", ";", ":"]


[MASKING]
masking = [{"name": "UUID", "regex_pattern": "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "mask_with": "<UUID>"}, {"name": "LONG_HEX", "regex_pattern": "[0-9a-fA-F]{16,}", "mask_with": "<HEX>"}, {"name": "IPV4", "regex_pattern": "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}", "mask_with": "<IP>"}, {"name": "NUMBER", "regex_pattern": "[0-9]+", "mask_with": "<NUM>"}, {"name": "UUID_COMPACT", "regex_pattern": "[0-9a-fA-F]{32}", "mask_with": "<HEX>"}]


[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = true
snapshot_file = drain3_snapshot.bin


[PROFILING]
enabled = false
report_sec = 60