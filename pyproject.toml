[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uri-cardinality-reducer"
version = "0.2.0"
description = "Extract low-cardinality URI templates from real URI's, requires drain3."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["drain3"]
authors = [
    {name = "David C. Sisk"}
]

[project.urls]
Repository = "https://github.com/davidcsisk/uri-cardinality-reducer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uri_cardinality_reducer = ["drain3.ini"]
